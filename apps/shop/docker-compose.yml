# 在仓库根目录执行：
#   docker compose -f apps/gpus/docker-compose.yml build
#   docker compose -f apps/gpus/docker-compose.yml up

services:
  gpus:
    image: gongji-crm-gpus:${TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/gpus/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
