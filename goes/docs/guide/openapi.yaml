openapi: 3.1.0
info:
  title: OpenRoute Edge Agent API
  description: |
    Edge Agent 与平台之间的通信协议。
    
    ## 通信模型
    
    Agent 采用 **Polling + Webhook** 混合通信模式：
    
    - **平台 → Agent**：Agent 定期拉取待执行任务（Polling）
    - **Agent → 平台**：任务结果实时上报（Webhook）
    
    ## 认证
    
    | 阶段 | 机制 | 说明 |
    |------|------|------|
    | 注册 | `agent_token` | 平台下发的一次性 Token |
    | API 调用 | JWT `access_token` | 注册后获取，24h 有效期 |
    | 平台回调 | HMAC 签名 | `X-Signature: sha256=...` |
    
    ## 版本
    
    - 当前版本：1.0.0
    - 协议版本：v1
  version: 1.0.0
  contact:
    name: OpenRoute Support
    email: support@openroute.cn

servers:
  - url: https://api.openroute.cn
    description: 生产环境
  - url: http://localhost:8080
    description: 本地开发（mock-server）

tags:
  - name: Agent
    description: Agent 注册与心跳
  - name: Tasks
    description: 任务管理
  - name: System
    description: 系统信息

paths:
  /api/agent/register:
    post:
      tags: [Agent]
      summary: Agent 注册
      description: |
        Agent 首次启动时调用，使用 `agent_token` 完成注册。
        注册成功后获取 JWT `access_token`，后续请求使用该 Token 认证。
        
        **注意**：`agent_token` 为一次性使用，注册成功后即废弃。
      operationId: registerAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              agent_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              agent_token: "oat_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
              datacenter: "SH-ZJ-01"
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                status: "registered"
                access_token: "eyJhbGciOiJIUzI1NiIs..."
                heartbeat_interval: 30
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token 无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "invalid or expired agent_token"

  /api/agent/heartbeat:
    post:
      tags: [Agent]
      summary: 心跳上报
      description: |
        Agent 定期调用，上报存活状态、设备数量和 K8s 连通性。
        
        平台通过心跳检测 Agent 是否在线。超过 `heartbeat_interval × 5` 未收到心跳则标记为离线。
      operationId: heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
            example:
              agent_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              k8s_reachable: true
              device_count: 12
      responses:
        '200':
          description: 心跳确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
              example:
                status: "ok"
        '401':
          description: 未认证或 Token 过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/agent/tasks/pending:
    get:
      tags: [Tasks]
      summary: 拉取待执行任务
      description: |
        Agent 定期调用，获取待执行的任务列表。
        
        返回的任务状态为 `pending`，Agent 拉取后应将状态更新为 `running` 并开始执行。
        
        **轮询频率建议**：每 15 秒一次（可在配置中调整 `polling.task_interval`）。
      operationId: fetchPendingTasks
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: 最大返回任务数
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
              example:
                tasks:
                  - id: "task_abc123"
                    type: "device_onboard"
                    priority: 1
                    payload:
                      device_sn: "SN2026A10001"
                      internal_ip: "10.0.1.101"
                      ssh_username: "root"
                      ssh_password: "encrypted_base64..."
                      gpu_card_type: "NVIDIA A100 80GB"
                      expected_gpu_count: 8
                      target_cluster_endpoint: "10.0.1.1:6443"
                      kubeadm_token: "abcdef.0123456789abcdef"
                      kubeadm_ca_hash: "abcd1234"
                      node_labels:
                        openroute.io/supplier: "hb-gpu-01"
                        openroute.io/datacenter: "sh-zj-01"
                  - id: "task_def456"
                    type: "device_offboard"
                    priority: 0
                    payload:
                      device_sn: "SN2026A00042"
                      node_name: "sn2026a00042"
                      drain_timeout_seconds: 1800
                      force: true
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/agent/tasks/{taskId}:
    patch:
      tags: [Tasks]
      summary: 上报任务执行结果
      description: |
        任务完成或失败时调用，上报各阶段执行结果。
        
        **状态流转**：
        - `running` → `completed`：所有阶段成功
        - `running` → `failed`：某阶段失败且重试耗尽
      operationId: reportTaskResult
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          description: 任务 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
            example:
              status: "completed"
              stages:
                - stage: "ssh_verify"
                  status: "success"
                  duration_ms: 1234
                  output:
                    os: "ubuntu"
                    version: "22.04"
                    kernel: "5.15.0-generic"
                - stage: "gpu_check"
                  status: "success"
                  duration_ms: 3412
                  output:
                    gpus:
                      - name: "NVIDIA A100-SXM4-80GB"
                        count: 1
                        memory: "81920 MiB"
                    count: 8
                - stage: "env_init"
                  status: "success"
                  duration_ms: 45234
                  output:
                    os: "ubuntu"
                    script_output: "env_init complete"
                - stage: "k8s_join"
                  status: "success"
                  duration_ms: 8912
                  output:
                    node_name: "sn2026a10001"
                    join_output: "This node has joined the cluster"
                - stage: "gpu_label"
                  status: "success"
                  duration_ms: 234
                  output:
                    node_name: "sn2026a10001"
      responses:
        '200':
          description: 结果已接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: "ok"
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/agent/version:
    get:
      tags: [System]
      summary: 获取最新 Agent 版本
      description: 安装脚本调用，获取最新可用版本号。
      operationId: getVersion
      responses:
        '200':
          description: 版本信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              example:
                latest: "1.0.0"
                versions:
                  - "1.0.0"
                  - "0.9.0"

  /api/agent/downloads/{version}/{file}:
    get:
      tags: [System]
      summary: 下载 Agent 二进制
      description: 安装脚本调用，下载指定版本的 Agent 二进制文件。
      operationId: downloadAgent
      parameters:
        - name: version
          in: path
          required: true
          description: 版本号
          schema:
            type: string
            example: "1.0.0"
        - name: file
          in: path
          required: true
          description: 文件名（格式：`openroute-agent-linux-{arch}.tar.gz`）
          schema:
            type: string
            example: "openroute-agent-linux-amd64.tar.gz"
      responses:
        '200':
          description: 二进制文件（tar.gz）
          content:
            application/gzip:
              schema:
                type: string
                format: binary
          headers:
            X-Checksum-SHA256:
              description: 文件 SHA256 校验和
              schema:
                type: string
        '404':
          description: 版本或文件不存在

  /health:
    get:
      tags: [System]
      summary: Agent 健康检查
      description: |
        平台或运维人员调用，检查 Agent 运行状态。
        
        端口为 Agent 本地 HTTP 端口（默认 9090），仅内网可达。
      operationId: healthCheck
      responses:
        '200':
          description: Agent 健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "ok"
                version: "1.0.0"
                uptime: "2h30m15s"
                task_queue: 0
                k8s_reachable: false
                devices: 12

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 注册后获取的 access_token

  schemas:
    RegisterRequest:
      type: object
      required: [agent_id, agent_token, datacenter]
      properties:
        agent_id:
          type: string
          format: uuid
          description: Agent 唯一标识（UUID）
        agent_token:
          type: string
          pattern: "^oat_"
          description: 平台下发的一次性注册 Token
        datacenter:
          type: string
          description: 机房编码
          example: "SH-ZJ-01"

    RegisterResponse:
      type: object
      properties:
        status:
          type: string
          enum: [registered]
        access_token:
          type: string
          description: JWT access_token（24h 有效期）
        heartbeat_interval:
          type: integer
          description: 建议心跳间隔（秒）
          example: 30

    HeartbeatRequest:
      type: object
      required: [agent_id, k8s_reachable, device_count]
      properties:
        agent_id:
          type: string
          format: uuid
        k8s_reachable:
          type: boolean
          description: Agent 是否可连接到 K8s API Server
        device_count:
          type: integer
          description: 当前管理的设备数量

    HeartbeatResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]

    TasksResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    Task:
      type: object
      required: [id, type, status, payload]
      properties:
        id:
          type: string
          description: 任务 ID
        type:
          type: string
          enum: [device_onboard, device_offboard]
          description: 任务类型
        status:
          type: string
          enum: [pending, running, completed, failed]
        priority:
          type: integer
          description: 优先级（越大越优先）
        payload:
          type: object
          description: 任务负载（结构取决于 type）
        max_retries:
          type: integer
          description: 最大重试次数
          default: 3
        created_at:
          type: string
          format: date-time

    OnboardPayload:
      type: object
      description: device_onboard 任务负载
      required: [device_sn, internal_ip, ssh_username, gpu_card_type, expected_gpu_count]
      properties:
        device_sn:
          type: string
          description: 设备序列号
        internal_ip:
          type: string
          format: ipv4
          description: 设备内网 IP
        ssh_username:
          type: string
          description: SSH 用户名
          default: "root"
        ssh_password:
          type: string
          description: SSH 密码（加密传输）
        gpu_card_type:
          type: string
          description: GPU 型号
          example: "NVIDIA A100 80GB"
        expected_gpu_count:
          type: integer
          description: 预期 GPU 数量
        target_cluster_endpoint:
          type: string
          description: K8s API Server 地址
          example: "10.0.1.1:6443"
        kubeadm_token:
          type: string
          description: kubeadm join token
        kubeadm_ca_hash:
          type: string
          description: CA 证书 hash
        node_labels:
          type: object
          additionalProperties:
            type: string
          description: K8s Node 标签

    OffboardPayload:
      type: object
      description: device_offboard 任务负载
      required: [device_sn, node_name]
      properties:
        device_sn:
          type: string
          description: 设备序列号
        node_name:
          type: string
          description: K8s Node 名称
        drain_timeout_seconds:
          type: integer
          description: Drain 超时（秒）
          default: 1800
        force:
          type: boolean
          description: 是否强制驱逐
          default: false

    TaskUpdateRequest:
      type: object
      required: [status, stages]
      properties:
        status:
          type: string
          enum: [completed, failed]
          description: 任务最终状态
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageResult'
          description: 各阶段执行结果
        error:
          type: string
          description: 失败时的错误信息

    StageResult:
      type: object
      required: [stage, status, duration_ms]
      properties:
        stage:
          type: string
          enum: [ssh_verify, gpu_check, env_init, k8s_join, gpu_label, cordon, drain, delete_node]
          description: 阶段名称
        status:
          type: string
          enum: [success, failed, skipped]
        duration_ms:
          type: integer
          description: 执行耗时（毫秒）
        output:
          type: object
          description: 阶段输出（结构取决于阶段）
        error:
          type: string
          description: 失败时的错误信息

    VersionResponse:
      type: object
      properties:
        latest:
          type: string
          description: 最新版本号
        versions:
          type: array
          items:
            type: string
          description: 所有可用版本

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Agent 版本号
        uptime:
          type: string
          description: 运行时长
        task_queue:
          type: integer
          description: 当前队列中的任务数
        k8s_reachable:
          type: boolean
          description: K8s API Server 是否可达
        devices:
          type: integer
          description: 管理的设备总数

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      properties:
        error:
          type: string
          description: 错误信息
