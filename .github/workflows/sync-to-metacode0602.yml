# Mirror openroute-ai/open-shop main → metacode0602/open-shop main.
#
# Choice: push HEAD:main with --force-with-lease (after fetching the mirror's
# main). That makes the target tip match this repo's main while refusing the
# push if the mirror moved between fetch and push (safer than bare --force).
# We only sync the main branch (not --mirror of all refs).
#
# Required secret on openroute-ai/open-shop:
#   METACODE_MIRROR_TOKEN — PAT (classic or fine-grained) with contents:write
#   on metacode0602/open-shop. Create as metacode0602 (or a collaborator with
#   write). Do not commit the token.

name: Sync to metacode0602/open-shop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to metacode0602/open-shop
        env:
          METACODE_MIRROR_TOKEN: ${{ secrets.METACODE_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${METACODE_MIRROR_TOKEN}" ]; then
            echo "::error::Secret METACODE_MIRROR_TOKEN is not set on this repository."
            echo "Create a PAT with contents:write on metacode0602/open-shop,"
            echo "then: gh secret set METACODE_MIRROR_TOKEN -R openroute-ai/open-shop"
            exit 1
          fi

          AUTH_B64="$(printf 'x-access-token:%s' "${METACODE_MIRROR_TOKEN}" | base64 -w0)"
          git remote add mirror https://github.com/metacode0602/open-shop.git

          git_mirror() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" "$@"
          }

          if git_mirror fetch mirror main; then
            # Target main exists: update with lease against the just-fetched tip.
            git_mirror push --force-with-lease=refs/heads/main:refs/remotes/mirror/main \
              mirror "HEAD:refs/heads/main"
          else
            # First sync (no main on target yet).
            git_mirror push mirror "HEAD:refs/heads/main"
          fi

          echo "Synced $(git rev-parse --short HEAD) → metacode0602/open-shop main"
