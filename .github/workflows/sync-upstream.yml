# Periodically sync this fork's main from openroute-ai/open-shop (private parent).
# Schedule: 0 16 * * * UTC ≈ 00:00 Asia/Shanghai daily. Also runnable via workflow_dispatch.
name: Sync upstream

on:
  schedule:
    # 16:00 UTC = 00:00 Asia/Shanghai (UTC+8)
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork main from parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Syncing ${{ github.repository }} main from parent openroute-ai/open-shop"
          gh repo sync "${{ github.repository }}" --branch main
          echo "Sync finished."
